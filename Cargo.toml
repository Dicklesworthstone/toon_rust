[package]
name = "tru"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "TOON reference implementation in Rust (JSON <-> TOON)"
license-file = "LICENSE"
readme = "README.md"
homepage = "https://github.com/Dicklesworthstone/toon_rust"
repository = "https://github.com/Dicklesworthstone/toon_rust"
documentation = "https://docs.rs/tru"
keywords = ["cli", "json", "serialization", "llm", "encoding"]
categories = ["command-line-utilities", "encoding"]
exclude = [
    ".beads/",
    ".cargo/",
    ".github/",
    "perf.data",
    "AGENTS.md",
    "EXISTING_TOON_RUST_STRUCTURE.md",
    "PLAN_TO_PORT_TOON_RUST_TO_RUST.md",
    "PROPOSED_ARCHITECTURE.md",
    "gh_og_share_image.png",
    "rust-toolchain.toml",
    "tests/golden_outputs/",
    "toon_illustration.webp",
    "storage.sqlite3",
]

[lib]
name = "toon"
path = "src/lib.rs"

[[bin]]
name = "toon"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# CLI (optional, enabled by `cli` feature)
clap = { version = "4.6.9", features = ["derive", "env"], optional = true }

# JSON interoperability (optional, enabled by `serde`, `cli`, and `wasm` features)
# float_roundtrip: JSON number text is read as the nearest binary64 (the default fast path drops
# digits beyond a 64-bit significand and rounds twice, so `0.3333333333333333333333` became
# 0.33333333333333337 and the largest finite double was rejected as out of range).
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"], optional = true }

# Async streaming (optional)
asupersync = { version = "=0.6.2", optional = true }

# WebAssembly (optional)
wasm-bindgen = { version = "0.2.130", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
js-sys = { version = "0.3.107", optional = true }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
criterion = { version = "0.8.2", features = ["html_reports"] }
walkdir = "2.5.1"
insta = { version = "1.49.0", features = ["json", "yaml"] }
proptest = "1.12.0"
rand = "0.10.4"

[[test]]
name = "cli_conversion"
required-features = ["cli"]

[[test]]
name = "cli_integration"
required-features = ["cli"]

[[test]]
name = "json_stream"
required-features = ["cli"]

[[test]]
name = "encode_fixtures"
required-features = ["serde"]

[[test]]
name = "decode_fixtures"
required-features = ["serde"]

[[test]]
name = "edge_cases"
required-features = ["serde"]

[[test]]
name = "conformance"
required-features = ["conformance"]

[[bench]]
name = "toon_benchmark"
harness = false
required-features = ["serde"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[features]
default = ["lib", "serde", "cli"]
# Minimal zero-dependency TOON encoder/decoder over `JsonValue`.
lib = []
# Optional `serde_json::Value` conversions and `json_to_toon` / `toon_to_json` helpers.
serde = ["lib", "dep:serde_json"]
# CLI binary (`toon`) and `toon::cli` module.
cli = ["lib", "serde", "dep:clap"]
conformance = ["serde", "cli"]
# Enable true async streaming using asupersync runtime
async-stream = ["lib", "dep:asupersync"]
# Enable WebAssembly bindings
wasm = ["lib", "serde", "dep:wasm-bindgen", "dep:console_error_panic_hook", "dep:js-sys"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
